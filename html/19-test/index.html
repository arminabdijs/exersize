<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>تمرین عملی فرم خلاقانه</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f2ff;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    form {
      background-color: #ffffff;
      border: 2px solid #00509e;
      border-radius: 20px;
      padding: 30px 40px;
      width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #00509e;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #003366;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    input[type="color"],
    input[type="range"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #a0a0a0;
      border-radius: 12px;
    }

    input[readonly] {
      background-color: #f0f0f0;
      color: #555;
    }

    input[disabled] {
      background-color: #e0e0e0;
      color: #888;
    }

    input:focus {
      outline: none;
      border-color: #00509e;
      box-shadow: 0 0 8px rgba(0,80,158,0.3);
    }

    button {
      width: 100%;
      background-color: #00509e;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #003366;
    }

    input[type="checkbox"],
    input[type="radio"] {
      margin-right: 10px;
      margin-bottom: 15px;
    }

    input[type="image"] {
      display: block;
      margin: 20px auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <form action="" method="post" autocomplete="on" target="_blank">
    <h2>فرم خلاقانه</h2>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="Username" minlength="4" maxlength="10" />

    <label for="readonly">Readonly Field:</label>
    <input type="text" id="readonly" name="readonly" value="Only View" readonly />

    <label for="disabled">Disabled Field:</label>
    <input type="text" id="disabled" name="disabled" placeholder="Can't type here" disabled />

    <label for="autofocus">Autofocus Field:</label>
    <input type="text" id="autofocus" name="autofocus" placeholder="Focused on load" autofocus />

    <label for="pattern">Pattern (Word + Word):</label>
    <input type="text" id="pattern" name="pattern" placeholder="e.g. Armin Abdi" pattern="(\w{3,16})([ ]{0,3})(\w{3,16})" required />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Password" required />

    <label for="checkbox">Checkbox1:</label>
    <input type="checkbox" id="checkbox" name="checkbox" />
    <label for="checkbox2">Checkbox2:</label>
    <input type="checkbox" id="checkbox2" name="checkbox" />

    <label for="radio1">Radio 1:</label>
    <input type="radio" id="radio1" name="radio" value="option1" />
    <label for="radio2">Radio 2:</label>
    <input type="radio" id="radio2" name="radio" value="option2" />

    <label for="color">Color:</label>
    <input type="color" id="color" name="color" />

    <input type="image" src="./images/crud-nodejs-mongo.avif" alt="Attack" width="200px" />

    <label for="date">Date:</label>
    <input type="date" id="date" name="date" />

    <label for="number">Number:</label>
    <input type="number" id="number" name="number" min="1" max="100" />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Email" />

    <label for="file">File:</label>
    <input type="file" id="file" name="file" accept="image/*" />

    <label for="range">Range:</label>
    <input type="range" id="range" name="range" min="1" max="100" />

    <button type="submit">Send</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
